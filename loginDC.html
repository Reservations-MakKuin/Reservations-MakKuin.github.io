<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <link rel="stylesheet" href="/css/styleLogin.min.css">
   
</head>
<body class="login">
    <div class="container">
        <h2 class="text-center">Login</h2>
        <br>
        <form class="loginForm">
            <div class="input-group">
                <label for="username" class="label">Username</label>
                <input type="text" id="username" class="input">
                <span class="error-message"></span>
            </div>
            <br>
            <div class="input-group">
                <label for="password" class="label">Password</label>
                <input type="password" id="password" class="input">
                <span class="error-message"></span>
            </div>
            <br>
            <!-- Променен е type на "button" и е премахнат action от формата -->
            <button class="button" onclick="myFunction()" type="button">Login</button>
      
        </form>
    </div>
    <script>
  
        function myFunction() {
            let loginPassword = document.getElementById("password").value;
            let userName = document.getElementById("username").value;
            
            if(loginPassword == 'MakKuin6775' && userName == "MakKuin"){
                
                localStorage.setItem('authV2','MakKuin6775-v2');
                // Добавено е правилното пренасочване към календара
                window.location.href = 'https://reservations-makkuin.github.io/calendarDC.html';
                
                console.log('Успешен логин');
            
            } else {
                console.log('Грешни данни');
                alert('Incorrect User or Password');
            }
        }
        
    </script>
</body>
</html>
